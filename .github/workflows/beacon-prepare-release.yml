name: Prepare Beacon release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version or release candidate (for example 1.2.0 or 1.2.0-rc.1)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  prepare:
    if: github.repository == 'beacon-observability/beacon-java'
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Run release preparation from main.' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] The final step pushes only the generated release PR branch.
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: ''
          package-manager-cache: false
      - name: Update release metadata
        env:
          VERSION: ${{ inputs.version }}
        run: node beacon/scripts/release-metadata.cjs prepare "$VERSION"
      - name: Create release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          branch="beaconbot/prepare-release-v$VERSION"
          tag="v$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch already exists: $branch" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -c "$branch"
          git add beacon/version.properties beacon/CHANGELOG.md
          git commit -m "Prepare Beacon Java $VERSION release"
          git push --set-upstream origin "$branch"
          url=$(gh pr create --base main --head "$branch" \
            --title "Prepare Beacon Java $VERSION release" \
            --body "Prepare the Beacon Java \`$VERSION\` release. After merge, run the full Beacon CI profile on the merge commit and pass that run ID to the Beacon release workflow.")
          echo "Created $url"
          gh workflow run beacon-ci.yml --ref "$branch" -f full=true -f native=false
