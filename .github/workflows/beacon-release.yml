name: Beacon release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version recorded in beacon/version.properties
        required: true
        type: string
      validation_run_id:
        description: Optional successful PR or manual CI run ID (auto-discover identical content when empty)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: beacon-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'beacon-observability/beacon-java'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.validation.outputs.digest }}
      build_commit: ${{ steps.validation.outputs.build_commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: ''
          package-manager-cache: false
      - id: metadata
        name: Validate source release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(node beacon/scripts/release-metadata.cjs validate-source "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - id: validation
        name: Download the tested candidate for identical source content
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        run: node beacon/scripts/ci-evidence.cjs download release-candidate
      - name: Reject an existing release or a conflicting tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]
            [[ "$(git rev-parse "refs/tags/$TAG^{}")" == "$GITHUB_SHA" ]]
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
      - id: candidate
        name: Record release provenance without rebuilding
        env:
          VALIDATION_RUN_ID: ${{ steps.validation.outputs.reuse_run_id }}
          BUILD_COMMIT: ${{ steps.validation.outputs.build_commit }}
          DIGEST: ${{ steps.validation.outputs.digest }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          stage="release-candidate"
          agent="beacon-javaagent-$VERSION.jar"
          printf '%s  %s\n' "$DIGEST" "$agent" > "$stage/$agent.sha256"
          validation_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID"
          node beacon/scripts/release-metadata.cjs write-notes \
            "$VERSION" "$stage/release-notes.md" "$GITHUB_SHA" "$DIGEST" "$validation_url"
          jq -n \
            --arg version "$VERSION" \
            --arg source_commit "$GITHUB_SHA" \
            --arg build_source_commit "$BUILD_COMMIT" \
            --arg source_tree "$(git rev-parse 'HEAD^{tree}')" \
            --arg agent_sha256 "$DIGEST" \
            --arg validation_run_id "$VALIDATION_RUN_ID" \
            --arg validation_url "$validation_url" \
            --slurpfile upstream beacon/upstream.lock.json \
            '{schema_version: 1, product: "Beacon Java", version: $version,
              source_repository: "https://github.com/beacon-observability/beacon-java",
              source_commit: $source_commit, build_source_commit: $build_source_commit,
              source_tree: $source_tree, agent_sha256: $agent_sha256,
              validation_run_id: $validation_run_id, validation_url: $validation_url,
              upstream: $upstream[0].upstream}' > "$stage/provenance.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-release-candidate-${{ steps.metadata.outputs.version }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beacon-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # zizmor: ignore[artipacked] This job creates only the validated immutable release tag.
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: ''
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beacon-release-candidate-${{ needs.candidate.outputs.version }}
          path: release-candidate
      - name: Revalidate the promoted candidate
        env:
          DIGEST: ${{ needs.candidate.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
          BUILD_COMMIT: ${{ needs.candidate.outputs.build_commit }}
        run: |
          node beacon/scripts/ci-evidence.cjs verify-payload release-candidate
          cd release-candidate
          sha256sum --check "beacon-javaagent-$VERSION.jar.sha256"
          node ../beacon/scripts/release-metadata.cjs verify-artifact \
            "beacon-javaagent-$VERSION.jar" "$VERSION" "$DIGEST"
          node ../beacon/scripts/release-metadata.cjs verify-sbom \
            "beacon-javaagent-$VERSION.spdx.json" "$VERSION" "$BUILD_COMMIT"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-candidate/beacon-javaagent-${{ needs.candidate.outputs.version }}.jar
            release-candidate/beacon-javaagent-${{ needs.candidate.outputs.version }}.spdx.json
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            [[ "$(git rev-parse "refs/tags/$TAG^{}")" == "$GITHUB_SHA" ]]
            [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$TAG" --message "Beacon Java $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$TAG" \
            --notes-file release-candidate/release-notes.md "${prerelease[@]}" \
            "release-candidate/beacon-javaagent-$VERSION.jar" \
            "release-candidate/beacon-javaagent-$VERSION.jar.sha256" \
            "release-candidate/beacon-javaagent-$VERSION.spdx.json" \
            release-candidate/provenance.json \
            release-candidate/LICENSE \
            release-candidate/THIRD_PARTY_LICENSES.md
      - name: Download and verify the published release
        env:
          DIGEST: ${{ needs.candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
          BUILD_COMMIT: ${{ needs.candidate.outputs.build_commit }}
        run: |
          mkdir published
          gh release download "$TAG" --dir published
          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          expected=(LICENSE THIRD_PARTY_LICENSES.md \
            "beacon-javaagent-$VERSION.jar" "beacon-javaagent-$VERSION.jar.sha256" \
            "beacon-javaagent-$VERSION.spdx.json" provenance.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${assets[*]}" == "${expected[*]}" ]]
          cd published
          sha256sum --check "beacon-javaagent-$VERSION.jar.sha256"
          node ../beacon/scripts/release-metadata.cjs verify-artifact \
            "beacon-javaagent-$VERSION.jar" "$VERSION" "$DIGEST"
          node ../beacon/scripts/release-metadata.cjs verify-sbom \
            "beacon-javaagent-$VERSION.spdx.json" "$VERSION" "$BUILD_COMMIT"
          cd ..
          node beacon/scripts/agent-smoke.cjs "published/beacon-javaagent-$VERSION.jar"
          node beacon/scripts/security-smoke.cjs "published/beacon-javaagent-$VERSION.jar" \
            release-candidate/verification/security-smoke-fixture.jar
