name: Beacon release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version recorded in beacon/version.properties
        required: true
        type: string
      validation_run_id:
        description: Successful full Beacon CI run ID for this exact source commit
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: beacon-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'beacon-observability/beacon-java'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      digest: ${{ steps.candidate.outputs.digest }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: ''
          package-manager-cache: false
      - id: metadata
        name: Validate source release metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(node beacon/scripts/release-metadata.cjs validate-source "$REQUESTED_VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Require full validation for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.validation_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > validation-run.json
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            > validation-jobs.json
          node beacon/scripts/release-metadata.cjs verify-ci \
            validation-run.json validation-jobs.json "$GITHUB_SHA"
      - name: Reject an existing release or a conflicting tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]
            [[ "$(git rev-parse "refs/tags/$TAG^{}")" == "$GITHUB_SHA" ]]
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
      - run: .github/scripts/gha-free-disk-space.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true
      - name: Build the release candidate once
        run: ./gradlew :javaagent:assemble :javaagent:verifyBeaconAgent :javaagent:spdxSbom --no-build-cache
      - name: Build Security smoke fixture
        run: ./gradlew -p beacon/testing/security-smoke-fixture shadowJar --no-build-cache
      - name: Test the exact candidate
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          agent="javaagent/build/libs/beacon-javaagent-$VERSION.jar"
          fixture="beacon/testing/security-smoke-fixture/build/libs/beacon-security-smoke-fixture.jar"
          node beacon/scripts/agent-smoke.cjs "$agent"
          node beacon/scripts/security-smoke.cjs "$agent" "$fixture"
      - id: candidate
        name: Stage the immutable candidate
        env:
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          stage="release-candidate"
          mkdir -p "$stage/verification"
          agent="beacon-javaagent-$VERSION.jar"
          sbom="beacon-javaagent-$VERSION.spdx.json"
          cp "javaagent/build/libs/$agent" "$stage/$agent"
          cp javaagent/build/spdx/beacon-javaagent.spdx.json "$stage/$sbom"
          cp LICENSE "$stage/LICENSE"
          cp licenses/licenses.md "$stage/THIRD_PARTY_LICENSES.md"
          cp beacon/testing/security-smoke-fixture/build/libs/beacon-security-smoke-fixture.jar \
            "$stage/verification/security-smoke-fixture.jar"
          digest=$(node beacon/scripts/release-metadata.cjs verify-artifact \
            "$stage/$agent" "$VERSION")
          node beacon/scripts/release-metadata.cjs verify-sbom \
            "$stage/$sbom" "$VERSION" "$GITHUB_SHA"
          printf '%s  %s\n' "$digest" "$agent" > "$stage/$agent.sha256"
          validation_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN_ID"
          node beacon/scripts/release-metadata.cjs write-notes \
            "$VERSION" "$stage/release-notes.md" "$GITHUB_SHA" "$digest" "$validation_url"
          jq -n \
            --arg version "$VERSION" \
            --arg source_commit "$GITHUB_SHA" \
            --arg agent_sha256 "$digest" \
            --arg validation_run_id "$VALIDATION_RUN_ID" \
            --arg validation_url "$validation_url" \
            --slurpfile upstream beacon/upstream.lock.json \
            '{schema_version: 1, product: "Beacon Java", version: $version,
              source_repository: "https://github.com/beacon-observability/beacon-java",
              source_commit: $source_commit, agent_sha256: $agent_sha256,
              validation_run_id: $validation_run_id, validation_url: $validation_url,
              upstream: $upstream[0].upstream}' > "$stage/provenance.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beacon-release-candidate-${{ steps.metadata.outputs.version }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: beacon-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # zizmor: ignore[artipacked] This job creates only the validated immutable release tag.
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: ''
          package-manager-cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beacon-release-candidate-${{ needs.candidate.outputs.version }}
          path: release-candidate
      - name: Revalidate the promoted candidate
        env:
          DIGEST: ${{ needs.candidate.outputs.digest }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          cd release-candidate
          sha256sum --check "beacon-javaagent-$VERSION.jar.sha256"
          node ../beacon/scripts/release-metadata.cjs verify-artifact \
            "beacon-javaagent-$VERSION.jar" "$VERSION" "$DIGEST"
          node ../beacon/scripts/release-metadata.cjs verify-sbom \
            "beacon-javaagent-$VERSION.spdx.json" "$VERSION" "$GITHUB_SHA"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-candidate/beacon-javaagent-${{ needs.candidate.outputs.version }}.jar
            release-candidate/beacon-javaagent-${{ needs.candidate.outputs.version }}.spdx.json
      - name: Create immutable tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            [[ "$(git rev-parse "refs/tags/$TAG^{}")" == "$GITHUB_SHA" ]]
            [[ "$(git cat-file -t "refs/tags/$TAG")" == tag ]]
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag --annotate "$TAG" --message "Beacon Java $VERSION"
            git push origin "refs/tags/$TAG"
          fi
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "Beacon Java $VERSION" \
            --notes-file release-candidate/release-notes.md "${prerelease[@]}" \
            "release-candidate/beacon-javaagent-$VERSION.jar" \
            "release-candidate/beacon-javaagent-$VERSION.jar.sha256" \
            "release-candidate/beacon-javaagent-$VERSION.spdx.json" \
            release-candidate/provenance.json \
            release-candidate/LICENSE \
            release-candidate/THIRD_PARTY_LICENSES.md
      - name: Download and verify the published release
        env:
          DIGEST: ${{ needs.candidate.outputs.digest }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.candidate.outputs.tag }}
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          mkdir published
          gh release download "$TAG" --dir published
          mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          expected=(LICENSE THIRD_PARTY_LICENSES.md \
            "beacon-javaagent-$VERSION.jar" "beacon-javaagent-$VERSION.jar.sha256" \
            "beacon-javaagent-$VERSION.spdx.json" provenance.json)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | sort)
          [[ "${assets[*]}" == "${expected[*]}" ]]
          cd published
          sha256sum --check "beacon-javaagent-$VERSION.jar.sha256"
          node ../beacon/scripts/release-metadata.cjs verify-artifact \
            "beacon-javaagent-$VERSION.jar" "$VERSION" "$DIGEST"
          node ../beacon/scripts/release-metadata.cjs verify-sbom \
            "beacon-javaagent-$VERSION.spdx.json" "$VERSION" "$GITHUB_SHA"
          cd ..
          node beacon/scripts/agent-smoke.cjs "published/beacon-javaagent-$VERSION.jar"
          node beacon/scripts/security-smoke.cjs "published/beacon-javaagent-$VERSION.jar" \
            release-candidate/verification/security-smoke-fixture.jar
