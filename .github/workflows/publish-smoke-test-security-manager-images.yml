name: Publish Security Manager test app images for smoke tests

on:
  push:
    paths:
      - "smoke-tests/images/security-manager/**"
      - ".github/workflows/publish-smoke-test-security-manager-images.yml"
      - ".github/workflows/reusable-publish-smoke-test-images.yml"
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-java-instrumentation' }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/reusable-publish-smoke-test-images.yml
    with:
      project: ":smoke-tests:images:security-manager"

  workflow-notification:
    permissions:
      issues: write
    needs:
      - publish
    if: ${{ github.repository == 'open-telemetry/opentelemetry-java-instrumentation' && (always()) }}
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@03559ef555db0eae5d85c3c6347d1530243e7aa7 # v0.13.0
    with:
      success: ${{ needs.publish.result == 'success' }}
