name: Publish Spring Boot images for smoke tests

on:
  push:
    paths:
      - "smoke-tests/images/spring-boot/**"
      - ".github/workflows/publish-smoke-test-spring-boot-images.yml"
      - ".github/workflows/reusable-publish-smoke-test-images.yml"
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.repository == 'open-telemetry/opentelemetry-java-instrumentation' }}
    permissions:
      contents: read
      packages: write
    uses: $/.github/workflows/reusable-publish-smoke-test-images.yml
    with:
      project: ":smoke-tests:images:spring-boot"

  workflow-notification:
    permissions:
      issues: write
    needs:
      - publish
    if: ${{ github.repository == 'open-telemetry/opentelemetry-java-instrumentation' && (always()) }}
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@f09a36e1fa2576787fe05cbc1313ef6066918c78 # v0.23.0
    with:
      success: ${{ needs.publish.result == 'success' }}
