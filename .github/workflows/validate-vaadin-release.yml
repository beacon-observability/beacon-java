name: Validate Vaadin release fixture
on:
  push:
    branches: [codex/validate-vaadin-latest-webpack]
permissions:
  contents: read
jobs:
  vaadin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/gha-free-disk-space.sh
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
      - name: Run the actual latest Vaadin 14 browser acceptance
        run: |
          node --version
          sed -i 's/org.gradle.jvmargs=/org.gradle.jvmargs=-Xmx3g /' gradle.properties
          ./gradlew :instrumentation:vaadin-14.2:javaagent:vaadin14LatestTest \
            -PtestLatestDeps=true -PtestShowStandardStreams=true --console=plain
      - name: Upload diagnostic reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vaadin-release-fixture-diagnostics
          path: |
            instrumentation/vaadin-14.2/javaagent/build/reports/tests/
            instrumentation/vaadin-14.2/javaagent/build/test-results/
            instrumentation/vaadin-14.2/javaagent/build/vaadin-*/webpack*.js
            instrumentation/vaadin-14.2/javaagent/build/vaadin-*/webpack*.json
          if-no-files-found: warn
