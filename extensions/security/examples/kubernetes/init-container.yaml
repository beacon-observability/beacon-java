# This example uses a private image built from beacon/docker/javaagent/Dockerfile.
# No public Beacon Java injection image is published by this change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    app.kubernetes.io/name: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
    spec:
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: beacon-javaagent
          image: registry.example.com/observability/beacon-javaagent:1.0.0
          command: ["cp", "/javaagent.jar", "/beacon/javaagent.jar"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: beacon-javaagent
              mountPath: /beacon
      containers:
        - name: application
          image: registry.example.com/apps/orders:replace-me
          env:
            # Append the agent option if the application already defines JAVA_TOOL_OPTIONS.
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/opt/beacon/javaagent.jar
            - name: BEACON_SECURITY_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: orders
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_TRACES_EXPORTER
              value: otlp
            - name: OTEL_METRICS_EXPORTER
              value: otlp
            - name: OTEL_LOGS_EXPORTER
              value: otlp
          volumeMounts:
            - name: beacon-javaagent
              mountPath: /opt/beacon
              readOnly: true
      volumes:
        - name: beacon-javaagent
          emptyDir: {}
