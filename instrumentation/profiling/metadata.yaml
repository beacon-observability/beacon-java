description: >
  EXPERIMENTAL: This instrumentation enables JVM profiling using Java Flight Recorder (Java 11+)
  and can periodically emit profiling snapshots.
library_link: https://github.com/open-telemetry/opentelemetry-java-instrumentation/tree/main/instrumentation/profiling
configurations:
  - name: otel.profiling.enabled
    description: >
      Enables Java profiling. Environment variable: OTEL_PROFILING_ENABLED.
    type: boolean
    default: false
  - name: otel.profiling.interval
    description: >
      Interval between profiling snapshots. Environment variable: OTEL_PROFILING_INTERVAL.
    type: string
    default: 1m
  - name: otel.profiling.startup-delay
    description: >
      Delay before profiling starts. Environment variable: OTEL_PROFILING_STARTUP_DELAY.
    type: string
    default: 0s
  - name: otel.profiling.max-age
    description: >
      Maximum retention window for the active JFR recording. Environment variable: OTEL_PROFILING_MAX_AGE.
    type: string
    default: 5m
  - name: otel.profiling.stack-depth
    description: >
      Unsupported per-recording option; explicit configuration emits a warning.
      Use JVM -XX:FlightRecorderOptions=stackdepth=<depth> instead; this affects all recordings.
      Environment variable: OTEL_PROFILING_STACK_DEPTH.
    type: int
    default: 64
  - name: otel.profiling.max-size
    description: >
      Max recording size in bytes. Set to 0 to leave JFR default. Environment variable: OTEL_PROFILING_MAX_SIZE.
    type: int
    default: 0
  - name: otel.profiling.temp-dir
    description: >
      Directory for detached final snapshots, removed after export. Defaults to the JVM temporary
      directory. This does not change the process-wide JFR repository.
      Environment variable: OTEL_PROFILING_TEMP_DIR.
    type: string
    default: ""
  - name: otel.profiling.memory.enabled
    description: >
      Enables memory-focused JFR overrides on top of the built-in profile template. Environment variable: OTEL_PROFILING_MEMORY_ENABLED.
    type: boolean
    default: false
  - name: otel.profiling.memory.allocation-sampling
    description: >
      Overrides allocation sampling events (ObjectAllocation*). Environment variable: OTEL_PROFILING_MEMORY_ALLOCATION_SAMPLING.
      Unset by default, so no explicit override is applied.
    type: boolean
    default: ""
  - name: otel.profiling.memory.old-object-sampling
    description: >
      Overrides OldObjectSample. Environment variable: OTEL_PROFILING_MEMORY_OLD_OBJECT_SAMPLING.
      Unset by default, so no explicit override is applied.
    type: boolean
    default: ""
  - name: otel.profiling.exporter
    description: >
      Profiling exporter implementation. Supported values are otlp and file. Environment variable: OTEL_PROFILING_EXPORTER.
    type: string
    default: otlp
  - name: otel.exporter.otlp.profiles.protocol
    description: >
      OTLP Profiles transport, http/protobuf or grpc. Falls back to the shared OTLP protocol, then http/protobuf. Used only by the otlp exporter.
    type: string
  - name: otel.exporter.otlp.profiles.endpoint
    description: >
      OTLP Profiles endpoint. Falls back to the shared OTLP endpoint, with /v1development/profiles appended for HTTP.
      Defaults to http://localhost:4318/v1development/profiles for HTTP or http://localhost:4317 for gRPC. Used only by the otlp exporter.
    type: string
  - name: otel.exporter.otlp.profiles.timeout
    description: >
      OTLP Profiles export timeout. Falls back to the shared OTLP timeout, then 10s. Used only by the otlp exporter.
    type: string
  - name: otel.exporter.otlp.profiles.headers
    description: >
      OTLP Profiles headers, percent-encoded key=value pairs. Falls back to shared OTLP headers. Used only by the otlp exporter.
    type: string
  - name: otel.profiling.file.path
    description: >
      Output directory used only by the file exporter. Environment variable: OTEL_PROFILING_FILE_PATH.
    type: string
    default: "${java.io.tmpdir}/otel-profiles"
