display_name: Spring AI
description: >
  This instrumentation creates GenAI client spans for Spring AI ChatModel calls and streams,
  marking streaming requests with gen_ai.request.stream.
library_link: https://spring.io/projects/spring-ai
semantic_conventions:
  - GENAI_CLIENT_SPANS
  - GENAI_CLIENT_METRICS
configurations:
  - name: otel.instrumentation.genai.capture-message-content
    declarative_name: java.common.gen_ai.capture_message_content
    type: boolean
    default: false
    description: >
      Enables including the full content of user and assistant messages in emitted log events.
      Note that full content can have data privacy and size concerns, and care should be taken when
      enabling this.
  - name: otel.instrumentation.spring-ai.experimental.capture-message-content-as-span-attributes.enabled
    declarative_name: java.spring_ai.capture_message_content_as_span_attributes/development.enabled
    type: boolean
    default: false
    description: >
      Enables capture of user and assistant message content in the gen_ai.input.messages and
      gen_ai.output.messages span attributes. This experimental setting has data privacy and size
      concerns.
  - name: otel.instrumentation.spring-ai.experimental.message-content-span-attribute.max-length
    declarative_name: java.spring_ai.message_content_span_attribute/development.max_length
    type: int
    default: 8192
    description: Maximum number of characters captured for each message content in a span attribute.
  - name: otel.instrumentation.spring-ai.experimental.stream-content.max-length
    declarative_name: java.spring_ai.stream_content/development.max_length
    type: int
    default: 65536
    description: >
      Maximum total characters retained for a stream across choices. Only retains text if a content
      destination is enabled. Zero retains no text. Truncation is reported in captured content.
